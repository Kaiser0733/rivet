name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Python identity and network checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release merge outputs for isolation check
        run: ./gradlew :app:processReleaseMainManifest :app:mergeReleaseResources --stacktrace

      - name: Verify debug mock-provider policy and release exclusion
        run: >
          python3 scripts/verify_network_security.py
          app/build/outputs/apk/debug/app-debug.apk
          app/build

      - name: Verify process service boundaries
        run: >
          python3 scripts/verify_runtime_manifest.py
          app/build/outputs/apk/debug/app-debug.apk
          app/build

      - name: Verify APK identity and signature
        run: >
          python3 scripts/verify_apk.py
          app/build/outputs/apk/debug/app-debug.apk
          debug.keystore android androiddebugkey

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rivet-verify-reports
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.*
            app/build/reports/prefix-efficiency.json

      - name: Stage verified debug APK
        id: stage
        run: python3 scripts/stage_apk.py debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: rivet-debug-apk
          path: ${{ steps.stage.outputs.apk_path }}
