name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag for the draft release (e.g. v0.11.0); empty builds the APK artifact only'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Refuse to run without release signing secrets
        env:
          KS: ${{ secrets.RIVET_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RIVET_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.RIVET_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.RIVET_KEY_PASSWORD }}
        run: |
          missing=0
          [ -n "$KS" ] || { echo "::error::Secret RIVET_KEYSTORE_BASE64 is not configured"; missing=1; }
          [ -n "$KS_PASS" ] || { echo "::error::Secret RIVET_KEYSTORE_PASSWORD is not configured"; missing=1; }
          [ -n "$KS_ALIAS" ] || { echo "::error::Secret RIVET_KEY_ALIAS is not configured"; missing=1; }
          [ -n "$KS_KEY_PASS" ] || { echo "::error::Secret RIVET_KEY_PASSWORD is not configured"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1

      - name: Require independently pinned production signer
        run: |
          if [ ! -f release/production-signer.sha256 ]; then
            echo "::error::Production signer is not pinned in release/production-signer.sha256"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build pinned llama.cpp JNI library (arm64-v8a, CPU)
        # llama.cpp is pinned in app/src/main/cpp/CMakeLists.txt. The tag and
        # checkout are also echoed in the release notes so a source archive can
        # reproduce this exact engine.
        env:
          LLAMA_CPP_TAG: v0.9.0
          LLAMA_CPP_COMMIT: cd959bae99ff4bed22bef2604f45241c09bbb8c8
          NDK_VERSION: 27.2.12479018
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_HOME:-${ANDROID_HOME}/ndk/${NDK_VERSION}}"
          if [ ! -d "$NDK" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --install "ndk;${NDK_VERSION}"
          fi
          rm -rf .native/llama.cpp build/llama-android
          mkdir -p .native
          git clone --depth 1 --branch "${LLAMA_CPP_TAG}" https://github.com/ggml-org/llama.cpp.git .native/llama.cpp
          test "$(git -C .native/llama.cpp rev-parse HEAD)" = "${LLAMA_CPP_COMMIT}"
          cmake -S app/src/main/cpp -B build/llama-android \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DLLAMA_CPP_DIR="$PWD/.native/llama.cpp"
          cmake --build build/llama-android --target rivet_llama -j2
          mkdir -p app/src/main/jniLibs/arm64-v8a
          find build/llama-android -name librivet_llama.so -exec cp {} app/src/main/jniLibs/arm64-v8a/ \;
          SO=app/src/main/jniLibs/arm64-v8a/librivet_llama.so
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          test -x "$STRIP"
          before=$(stat -c%s "$SO")
          echo "librivet_llama.so before strip: ${before} bytes"
          "$STRIP" --strip-unneeded "$SO"
          after=$(stat -c%s "$SO")
          echo "librivet_llama.so after strip: ${after} bytes (saved $((before - after)) bytes)"
          file "$SO"

      - name: Decode release keystore
        env:
          RIVET_KEYSTORE_BASE64: ${{ secrets.RIVET_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RIVET_KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "RIVET_KEYSTORE_FILE=release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          RIVET_KEYSTORE_PASSWORD: ${{ secrets.RIVET_KEYSTORE_PASSWORD }}
          RIVET_KEY_ALIAS: ${{ secrets.RIVET_KEY_ALIAS }}
          RIVET_KEY_PASSWORD: ${{ secrets.RIVET_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK identity and release signature
        env:
          RIVET_KEYSTORE_PASSWORD: ${{ secrets.RIVET_KEYSTORE_PASSWORD }}
          RIVET_KEY_ALIAS: ${{ secrets.RIVET_KEY_ALIAS }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >
          python3 scripts/verify_apk.py
          app/build/outputs/apk/release/app-release.apk
          release.keystore "$RIVET_KEYSTORE_PASSWORD" "$RIVET_KEY_ALIAS"
          release/production-signer.sha256 "$RELEASE_TAG"

      - name: Remove decoded keystore
        if: always()
        run: rm -f release.keystore

      - name: Stage verified release APK
        id: stage
        run: python3 scripts/stage_apk.py release

      - name: Upload signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: rivet-release-apk
          path: ${{ steps.stage.outputs.apk_path }}

      - name: Create draft GitHub Release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          STAGED_APK: ${{ steps.stage.outputs.apk_path }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use vMAJOR.MINOR.PATCH"
            exit 1
          fi
          gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
            --title "Rivet $RELEASE_TAG" "$STAGED_APK"
